<!DOCTYPE html>
<html lang="en" data-side="pretty">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pretty Killer Leaks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:wght@700;900&family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&family=Karla:wght@400;600;800&display=swap">
<style>
/* ============ TOKENS ============
   Same two worlds as the shop and tickets, picked by the clock:
   pretty = AM (pink, ransom-note letters)   killer = PM (black, hot pink) */
:root{
  --ground:#f8d2e1; --surface:#fffafc; --ink:#161015; --muted:#8e5a73;
  --accent:#f25fc4; --accent-ink:#161015; --line:#e9b1c9;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Karla",system-ui,sans-serif;
  --mono:"Special Elite","Courier New",monospace;
  --radius:3px; --shadow:0 18px 28px -14px rgba(120,30,75,.45);
  --label-case:none; --label-track:.04em;
  color-scheme:light;
}
:root[data-side="killer"]{
  --ground:#09080a; --surface:#141216; --ink:#f2ecf0; --muted:#8c8390;
  --accent:#ff3fae; --accent-ink:#0a0a0a; --line:#2c272f;
  --display:"Anton","Impact",sans-serif;
  --body:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:0px; --shadow:6px 6px 0 0 #ff3fae;
  --label-case:uppercase; --label-track:.14em;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;transition:background .3s,color .3s}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.label{font:600 12px/1.2 var(--mono);text-transform:var(--label-case);letter-spacing:var(--label-track);color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;flex-wrap:wrap}
.brand{color:var(--ink);text-decoration:none;display:flex;flex-direction:column}
.brand b{font:900 22px/1 var(--display)}
[data-side="killer"] .brand b{font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.brand span{font:12px/1.4 var(--mono);color:var(--muted)}
.side-pill{display:flex;align-items:center;gap:8px;background:var(--surface);padding:8px 12px;border-radius:999px;font:600 12px var(--mono);box-shadow:var(--shadow)}
.side-pill i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
[data-side="killer"] .side-pill{border-radius:0}

.hero{padding:40px 0 28px}
.eyebrow{font:600 13px var(--mono);text-transform:var(--label-case);letter-spacing:var(--label-track);color:var(--accent)}
.title{margin:10px 0 0;font:900 clamp(64px,14vw,150px)/.9 var(--display);display:flex;flex-wrap:wrap;gap:4px}
.title .ch{display:inline-block;padding:2px 10px;background:var(--surface);transform:rotate(var(--r,0deg))}
[data-side="killer"] .title{font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--accent);gap:0}
[data-side="killer"] .title .ch{background:none;padding:0;transform:none}
.hero p{max-width:52ch;font-size:18px;margin:22px 0 0;background:var(--surface);padding:14px 16px;box-shadow:var(--shadow);border-radius:var(--radius)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}
.tab{font:600 13px var(--mono);text-transform:var(--label-case);letter-spacing:var(--label-track);padding:10px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;cursor:pointer}
[data-side="killer"] .tab{border-radius:0}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .n{opacity:.6;margin-left:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding-bottom:64px;align-items:start}
.leak{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.leak .media{background:#0b0a0c;aspect-ratio:16/9;display:grid;place-items:center;position:relative}
.leak video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.leak .cover{width:100%;height:100%;object-fit:cover;display:block}
.leak .media.tall{aspect-ratio:3/4;overflow:hidden}
.leak .media.tall video{position:absolute;inset:0}
.leak .pic{position:absolute;inset:0;display:block}
.leak .disc{width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 9%,var(--accent) 10% 13%,#1b151a 14% 100%);box-shadow:0 0 0 6px rgba(255,255,255,.06)}
.leak .badge{position:absolute;top:10px;left:10px;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;background:var(--accent);color:var(--accent-ink);padding:4px 8px;border-radius:var(--radius)}
.leak .badge.side{left:auto;right:10px;background:var(--surface);color:var(--ink)}
.leak .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.leak h3{margin:0;font:900 22px/1.15 var(--display)}
[data-side="killer"] .leak h3{font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.leak p{margin:0;font-size:14px;color:var(--muted)}
.leak audio{width:100%}

.empty{grid-column:1/-1;text-align:center;padding:56px 16px;background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;font:900 30px/1.1 var(--display);margin-bottom:6px}
[data-side="killer"] .empty b{font-weight:400;text-transform:uppercase;color:var(--accent)}
.empty span{color:var(--muted);font-size:15px}

footer{padding:24px 0 40px;font:12px var(--mono);color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:var(--radius);font-weight:600;font-size:14px}
@media (max-width:560px){ .brand span{display:none} .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="#"><b>Finn Shapiro</b><span>Leaks · snippets + teasers</span></a>
    <div class="side-pill"><i></i><span id="sideName">AM · Pretty side</span></div>
  </header>

  <section class="hero">
    <span class="eyebrow">Pretty Killer · you didn't hear it from me</span>
    <h1 class="title" id="heroTitle" aria-label="Leaks"></h1>
    <p id="heroSub">Snippets of songs and teasers before anyone else. New leaks drop here first.</p>
  </section>

  <div class="tabs" role="group" aria-label="Show">
    <button class="tab" type="button" data-tab="all" aria-pressed="true">All<span class="n" id="nAll"></span></button>
    <button class="tab" type="button" data-tab="snippet" aria-pressed="false">Snippets<span class="n" id="nSnippet"></span></button>
    <button class="tab" type="button" data-tab="teaser" aria-pressed="false">Teasers<span class="n" id="nTeaser"></span></button>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    <a href="https://qwerty-ally.github.io/pretty-killer-tickets/">Tickets</a>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   LEAKS — add a new one here, newest first.
   type:  "snippet" (a song clip: an .mp3 in media/snippets/)
          "teaser"  (a video: an .mp4 in media/teasers/, or a picture: image instead of file)
   side:  "pretty", "killer" or "both"
   cover: optional picture for a snippet (shows above the player)
   poster: optional picture shown on a video teaser before it plays
   vertical: true for a phone-shaped (tall) video
   ===================================================================== */
const LEAKS = [
  { type:"teaser", side:"killer", title:"PK", note:"PKKKKKKK", file:"media/teasers/pk-march-7.mp4", poster:"media/teasers/pk-march-7.jpg", date:"2026-11-05" },
  { type:"teaser", side:"both", title:"Tour dates!", note:"Killer Mar 7 · Pretty Mar 8", file:"media/teasers/tour-dates.mp4", poster:"media/teasers/tour-dates.jpg", date:"2026-11-05" },
  { type:"teaser", side:"both", title:"Music videos: PK + Worked", note:"Coming soon…", file:"media/teasers/music-videos-coming-soon.mp4", poster:"media/teasers/music-videos-coming-soon.jpg", vertical:true, date:"2026-11-02" },
  { type:"teaser", side:"killer", title:"Lucky", note:"Coming soon…", file:"media/teasers/lucky-coming-soon.mp4", poster:"media/teasers/lucky-coming-soon.jpg", date:"2026-11-02" },
  { type:"teaser", side:"pretty", title:"Anne", note:"Coming soon…", image:"media/teasers/anne-coming-soon.png", date:"2026-11-01" },
  // { type:"snippet", side:"pretty", title:"Anne", note:"15 seconds of the chorus", file:"media/snippets/anne.mp3", cover:"media/snippets/anne.png", date:"2026-11-01" },
  // { type:"teaser",  side:"killer", title:"Killer teaser", note:"Something's coming", file:"media/teasers/killer-teaser.mp4", date:"2026-11-01" },
];

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const SIDES = {
  pretty:{ pill:"AM · Pretty side", word:"Leaks", ransom:[-4, 3, -2, 5, -3] },
  killer:{ pill:"PM · Killer side", word:"Leaks", ransom:[0] }
};
let side = "pretty", override = null, tab = "all";
try { override = sessionStorage.getItem("pk-side-override"); } catch(e){}
const clockSide = () => new Date().getHours() < 12 ? "pretty" : "killer";

function setSide(next){
  side = next;
  document.documentElement.dataset.side = side;
  const s = SIDES[side];
  $("#sideName").textContent = s.pill;
  $("#heroTitle").innerHTML = [...s.word].map((ch, i) => `<span class="ch" style="--r:${s.ransom[i % s.ransom.length]}deg" aria-hidden="true">${ch}</span>`).join("");
}

function card(l){
  const when = l.date ? new Date(l.date + "T12:00:00").toLocaleDateString([], { month:"short", day:"numeric", year:"numeric" }) : "";
  const sideTag = l.side === "both" ? "Pretty + Killer" : l.side === "killer" ? "Killer" : "Pretty";
  const media = l.image
    ? `<a class="pic" href="${esc(l.image)}" target="_blank" rel="noopener" aria-label="Open the full picture"><img class="cover" src="${esc(l.image)}" alt="${esc(l.title)} teaser" loading="lazy"></a>`
    : l.type === "teaser"
    ? `<video src="${esc(l.file)}" ${l.poster ? `poster="${esc(l.poster)}"` : ""} controls playsinline preload="metadata"></video>`
    : l.cover ? `<img class="cover" src="${esc(l.cover)}" alt="" loading="lazy">` : `<div class="disc" aria-hidden="true"></div>`;
  return `<article class="leak">
    <div class="media${l.image || l.vertical ? " tall" : ""}">${media}<span class="badge">${l.type === "teaser" ? "Teaser" : "Snippet"}</span><span class="badge side">${sideTag}</span></div>
    <div class="body">
      <h3>${esc(l.title)}</h3>
      ${l.note || when ? `<p>${esc(l.note)}${l.note && when ? " · " : ""}${esc(when)}</p>` : ""}
      ${l.type === "snippet" ? `<audio src="${esc(l.file)}" controls preload="none"></audio>` : ""}
    </div>
  </article>`;
}

function render(){
  const list = LEAKS.filter(l => tab === "all" || l.type === tab);
  $("#nAll").textContent = LEAKS.length || "";
  $("#nSnippet").textContent = LEAKS.filter(l => l.type === "snippet").length || "";
  $("#nTeaser").textContent = LEAKS.filter(l => l.type === "teaser").length || "";
  const what = tab === "snippet" ? "snippets" : tab === "teaser" ? "teasers" : "leaks";
  $("#grid").innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty"><b>Nothing leaked yet</b><span>No ${what} yet. Check back soon.</span></div>`;
}

// only one thing plays at a time
document.addEventListener("play", e => document.querySelectorAll("audio,video").forEach(m => { if (m !== e.target) m.pause(); }), true);
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));

// testing: type "am" or "pm" to switch sides, "auto" to follow the clock
let typed = "", toastTimer;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea") || e.key.length !== 1) return;
  typed = (typed + e.key.toLowerCase()).slice(-8);
  const set = v => { override = v; try { v ? sessionStorage.setItem("pk-side-override", v) : sessionStorage.removeItem("pk-side-override"); } catch(err){} };
  if (typed.endsWith("am")){ set("pretty"); typed = ""; setSide("pretty"); toast("Switched to AM · Pretty side"); }
  else if (typed.endsWith("pm")){ set("killer"); typed = ""; setSide("killer"); toast("Switched to PM · Killer side"); }
  else if (typed.endsWith("auto")){ set(null); typed = ""; setSide(clockSide()); toast("Following the clock again"); }
});
setInterval(() => { if (!override && clockSide() !== side) setSide(clockSide()); }, 60000);

setSide(override || clockSide());
render();
</script>
</body>
</html>
